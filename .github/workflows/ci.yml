name: Handbook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: ultralytics/actions/setup-uv@main
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      - name: Validate Handbook
        run: zensical build --strict
      - name: Trigger Handbook redeploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERCEL_HANDBOOK_DEPLOY_HOOK: ${{ secrets.VERCEL_HANDBOOK_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --retry 3 --request POST "$VERCEL_HANDBOOK_DEPLOY_HOOK"
